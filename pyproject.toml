[project]
name = "vera-bot"
version = "1.0.0"
description = "Message engine for Vera, magicpin's merchant-growth assistant"
requires-python = ">=3.10"

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
